name: INZ Date Select
description: Date filtering and proximity sorting for the gallery picker in the scene editor and the scene picker in the gallery editor.
version: 1.0.1
ui:
  javascript:
    - inzDateSelect.js
  css:
    - inzDateSelect.css
settings:
  similarDaysSpread:
    displayName: Similar days spread
    description: Half-width in days of the window used by the "similar days" button. 0 means use the built-in default of 45.
    type: NUMBER
  disableProximitySort:
    displayName: Keep alphabetical order
    description: By default, while a date filter is active the dropdown is ordered by distance from the edited date. Turn this on to keep the usual title order instead.
    type: BOOLEAN
