name: INZ Download Records
description: Imports the metadata the site userscripts send on download into scenes and galleries, matched by file name.
version: 1.1.0
interface: raw
errLog: error
exec:
  - python3
  - "{pluginDir}/inzRecords.py"

# records.js and queries.js declare the InzRecords namespace inzRecords.js uses,
# so they load first.
ui:
  javascript:
    - records.js
    - queries.js
    - inzRecords.js
  css:
    - inzRecords.css

settings:
  skipSource:
    displayName: Leave the source field off
    description: The import dialog starts with custom field "source" (the direct file link) switched off; it can still be switched on per entity there.
    type: BOOLEAN

# No tasks: the store is fed through runPluginOperation and read by the UI the
# same way.
