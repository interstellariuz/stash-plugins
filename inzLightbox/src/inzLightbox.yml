name: INZ Lightbox
description: Remembered per-photo zoom, smooth cursor-anchored zoom, hotkeys, auto fullscreen and steadier touch gestures for the image lightbox.
version: 1.0.0

# geometry.js, store.js and settings.js declare the InzLightbox namespace
# inzLightbox.js uses, so they load first.
ui:
  javascript:
    - geometry.js
    - store.js
    - settings.js
    - inzLightbox.js
  css:
    - inzLightbox.css

# Key settings take KeyboardEvent.code names (Space, ArrowUp, KeyZ), single
# letters and digits (Z, 5) or a comma-separated list; empty means the default,
# "none" turns the action off. Codes are physical keys, so any layout works.
settings:
  autoFullscreen:
    displayName: Auto fullscreen
    description: Enter fullscreen when the lightbox opens; Esc then closes the lightbox, not just fullscreen. Also in the lightbox options.
    type: BOOLEAN
  disableRememberZoom:
    displayName: Do not remember zoom
    description: By default every photo returns to its last zoom and position for the rest of the browser tab's session.
    type: BOOLEAN
  disableSmoothZoom:
    displayName: Disable smooth zoom
    description: Zoom from the mouse wheel and the zoom keys in steps instead of animating.
    type: BOOLEAN
  hideZoomIndicator:
    displayName: Hide zoom indicator
    description: Do not show the zoom percentage in the middle of the screen while zooming. Never shown on touch devices.
    type: BOOLEAN
  keyFill:
    displayName: "Key: fill screen / 100% / back"
    description: Fills the screen, a second press shows 100%, a third returns to where it started. Default Space.
    type: STRING
  keyZoomIn:
    displayName: "Key: zoom in"
    description: Zoom in by 15%. Default ArrowUp.
    type: STRING
  keyZoomOut:
    displayName: "Key: zoom out"
    description: Zoom out by 15%. Default ArrowDown.
    type: STRING
  keyOriginal:
    displayName: "Key: 100%"
    description: Original size. Default Z.
    type: STRING
  keyFitScreen:
    displayName: "Key: fit to screen"
    description: Default X.
    type: STRING
  keyFitWidth:
    displayName: "Key: fit horizontally"
    description: Default C.
    type: STRING
